<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>House Upkeep Log</title>
  <meta name="description" content="Track recurring home maintenance chores and see what's due.">
  <meta name="theme-color" content="#EEF2F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0C12" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Upkeep">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="app">
    <header class="appbar">
      <div class="appbar-text">
        <div class="eyebrow" id="today"></div>
        <h1 id="pageTitle">Tasks</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
    </header>

    <section id="summary" aria-label="Summary"></section>
    <div class="search" id="searchBar" hidden>
      <span class="search-ic" id="searchIcon"></span>
      <input id="search" type="search" placeholder="Search tasks" aria-label="Search" autocomplete="off" enterkeyhint="search">
      <button class="search-clear" id="clearSearch" aria-label="Clear search" hidden></button>
    </div>
    <div class="chips" id="areaChips" role="group" aria-label="Filter by area"></div>
    <main id="main"></main>
  </div>

  <button class="fab" id="addBtn" aria-label="Add task"></button>

  <nav class="tabbar" aria-label="Sections">
    <span class="tab-indicator" aria-hidden="true"></span>
    <button data-view="tasks" aria-pressed="true"><span class="tab-ic" data-icon="tasks"></span><span>Tasks</span></button>
    <button data-view="history" aria-pressed="false"><span class="tab-ic" data-icon="history"></span><span>History</span></button>
    <button data-view="home" aria-pressed="false"><span class="tab-ic" data-icon="home"></span><span>Home info</span></button>
  </nav>

  <div id="sheetHost"></div>
  <div id="toastHost" aria-live="polite"></div>

  <noscript><p class="app">House Upkeep Log needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
