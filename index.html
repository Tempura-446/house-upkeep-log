<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>House Upkeep Log</title>
  <meta name="description" content="Track recurring home maintenance chores and see what's due.">
  <meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141A19" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Upkeep">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="eyebrow" id="today"></div>
        <h1>House Upkeep Log</h1>
      </div>
      <div class="top-actions">
        <button class="btn" id="backupBtn">Backup</button>
        <button class="btn primary" id="addBtn">+ Add task</button>
      </div>
    </header>

    <div class="tally" aria-label="Task status summary">
      <div class="t-late"><b id="nLate">0</b><span>overdue</span></div>
      <div class="t-soon"><b id="nSoon">0</b><span>due in 2 weeks</span></div>
      <div class="t-ok"><b id="nOk">0</b><span>on track</span></div>
    </div>

    <div class="bar">
      <div class="tabs" role="group" aria-label="View">
        <button id="tabTasks" aria-pressed="true">Tasks</button>
        <button id="tabHist" aria-pressed="false">History</button>
      </div>
      <div class="chips" id="areaChips" role="group" aria-label="Filter by area"></div>
    </div>

    <main id="main"></main>
  </div>

  <div id="sheetHost"></div>
  <div id="toastHost" aria-live="polite"></div>

  <noscript><p class="wrap">House Upkeep Log needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
