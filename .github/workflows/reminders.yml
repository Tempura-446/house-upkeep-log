name: Send reminders

on:
  schedule:
    - cron: "7 * * * *" # every hour; each device gets at most one reminder a day at its chosen time
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification to every device now"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # lets the keep-alive step re-enable this schedule

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install web-push
        run: npm install --no-save web-push@3.6.7
      - name: Send
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST: ${{ inputs.test && '1' || '' }}
        run: node scripts/send-reminders.mjs

      # GitHub pauses scheduled workflows in public repos after 60 days without commits.
      # Re-enabling this workflow once a week keeps reminders running while you're busy.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u%H)" = "103" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/reminders.yml/enable" && echo "Schedule kept alive."
          fi
